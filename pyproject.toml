[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stmem-demo"
version = "0.2.0"
description = "ST-Mem core demo and optional SAM3, ViPE, DINOv2 and Qwen3-VL video integration"
readme = "docs/demo.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy>=1.26,<3", "pydantic>=2.6,<3", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]
perception = [
  "numpy>=1.26,<2", "setuptools>=77,<81", "torch>=2.7,<2.8",
  "torchvision>=0.22,<0.23", "transformers>=5,<6",
  "opencv-python-headless>=4.9,<4.12", "safetensors", "einops", "timm",
  "OpenEXR<3.3", "psutil", "pycocotools", "av",
]

[project.urls]
Homepage = "https://sealical.github.io/st-mem/"
Repository = "https://github.com/Sealical/st-mem"
Paper = "https://arxiv.org/abs/2609.04802"

[project.scripts]
stmem = "stmem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stmem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

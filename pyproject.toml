[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stmem-demo"
version = "0.1.0"
description = "Standalone CPU demo of Linguistic Trajectory Encoding and ST-Mem retrieval"
readme = "docs/demo.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26,<3", "pydantic>=2.6,<3", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]

[project.urls]
Homepage = "https://sealical.github.io/st-mem/"
Repository = "https://github.com/Sealical/st-mem"
Paper = "https://arxiv.org/abs/2609.04802"

[project.scripts]
stmem = "stmem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stmem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
